<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffb92f" />
  <title>Tier Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/tier-party-favicon.png" />
  <link rel="apple-touch-icon" href="assets/tier-party-favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="appConfirmOverlay" class="app-confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="appConfirmTitle">
    <div class="app-confirm-card">
      <div class="app-confirm-icon">!</div>
      <h2 id="appConfirmTitle">Tem certeza?</h2>
      <p id="appConfirmMessage">Deseja continuar?</p>
      <div class="app-confirm-actions">
        <button id="appConfirmCancel" class="btn ghost">Cancelar</button>
        <button id="appConfirmOk" class="btn coral">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
